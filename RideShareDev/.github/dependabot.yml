version: 2
updates:
  # Client dependencies
  - package-ecosystem: "npm"
    directory: "/Client/CarPoolApp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo/*"
      react:
        patterns:
          - "react"
          - "react-*"
      development:
        dependency-type: "development"

  # Server dependencies
  - package-ecosystem: "npm"
    directory: "/Server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      grpc:
        patterns:
          - "*grpc*"
      development:
        dependency-type: "development"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
