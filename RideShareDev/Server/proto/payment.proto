syntax = "proto3";

package payment;

message Payment {
  string id = 1;
  string user_id = 2;
  string trip_id = 3;
  double amount = 4;
  string currency = 5;
  enum PaymentStatus {
    PENDING = 0;
    COMPLETED = 1;
    FAILED = 2;
    REFUNDED = 3;
  }
  PaymentStatus status = 6;
  string transaction_id = 7;
  string gateway_response = 8;
}

message InitiatePaymentRequest {
  string user_id = 1;
  string trip_id = 2;
  double amount = 3;
  string currency = 4;
}

message InitiatePaymentResponse {
  string payment_url = 1;
  string transaction_id = 2;
}

message HandlePaymentCallbackRequest {
  string transaction_id = 1;
  string status = 2;
  string gateway_response = 3;
}

message HandlePaymentCallbackResponse {
  Payment payment = 1;
}

service PaymentService {
  rpc InitiatePayment (InitiatePaymentRequest) returns (InitiatePaymentResponse);
  rpc HandlePaymentCallback (HandlePaymentCallbackRequest) returns (HandlePaymentCallbackResponse);
}
