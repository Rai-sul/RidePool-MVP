syntax = "proto3";

package profile;

message UserProfile {
  string id = 1;
  string unique_id = 2;
  string name = 3;
  string email = 4;
  string phone_number = 5;
  string avatar_url = 6;
  repeated string friends = 7;
}

message CreateUserProfileRequest {
  UserProfile profile = 1;
}

message GetUserProfileRequest {
  string id = 1;
}

message GetUserByUniqueIdRequest {
  string unique_id = 1;
}

message AddFriendRequest {
  string user_id = 1;
  string friend_unique_id = 2;
}

message UserProfileResponse {
  UserProfile profile = 1;
}

service ProfileService {
  rpc CreateUserProfile (CreateUserProfileRequest) returns (UserProfileResponse);
  rpc GetUserProfile (GetUserProfileRequest) returns (UserProfileResponse);
  rpc GetUserByUniqueId (GetUserByUniqueIdRequest) returns (UserProfileResponse);
  rpc AddFriend (AddFriendRequest) returns (UserProfileResponse);
}
