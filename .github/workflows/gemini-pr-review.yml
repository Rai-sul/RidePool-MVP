# FILE: .github/workflows/gemini-pr-review.yml
#
# This workflow runs in two situations:
# 1. When a new Pull Request is opened.
# 2. When it's manually triggered by the 'gemini-dispatch' workflow 
#    (e.g., from a "@gemini-cli /review" comment).

name: Gemini PR Review

on:
  # Trigger on new pull requests
  pull_request:
    types: [opened]
  # Trigger when dispatched from our other workflow
  workflow_dispatch:
    inputs:
      command:
        description: 'The Gemini CLI command to run'
        required: true
      # This context is passed from the dispatch action
      context:
        description: 'JSON event context from the triggering comment'
        required: true

permissions:
  # Required to read the contents of the pull request
  pull-requests: read
  # Required to write review comments back to the PR
  contents: write

jobs:
  pr_review:
    runs-on: ubuntu-latest
    steps:
      - name: Run Gemini PR Review
        uses: google-github-actions/run-gemini-cli@v1
        with:
          # This is the "prompt" for the Gemini model.
          # We're asking it to act as a reviewer.
          prompt: "Review this pull request"
          # This is the secret key you created
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # The GitHub token is used to post the comment
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # This tells the action which PR to look at
          pr_number: ${{ github.event.pull_request.number }}
          # This passes in the context if it was from a dispatch command
          dispatch_context: ${{ github.event.inputs.context }}
