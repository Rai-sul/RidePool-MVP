name: Expo Preview Build

on:
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'Client/CarPoolApp/**'

jobs:
  preview:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    defaults:
      run:
        working-directory: Client/CarPoolApp
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Client/CarPoolApp/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Create EAS Preview
        run: |
          echo "====To enable Expo Preview Builds:===="
          echo "1. Create an Expo account: https://expo.dev"
          echo "2. Run: eas build:configure"
          echo "3. Generate EXPO_TOKEN: eas whoami && eas build:configure"
          echo "4. Add EXPO_TOKEN to GitHub repository secrets"
          echo ""
          echo "5. Uncomment the command below:"
          # eas build --platform android --profile preview --non-interactive
          # eas build --platform ios --profile preview --non-interactive

      - name: Comment PR with QR Code
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📱 **Expo Preview Build**\n\nOnce EAS is configured, QR codes for iOS and Android builds will appear here!'
            })
