name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  server-lint-build:
    name: Server - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: Server/dist/
          retention-days: 5

  server-unit-tests:
    name: Server - Unit Tests
    runs-on: ubuntu-latest
    needs: server-lint-build
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Server/coverage/
          retention-days: 5

  server-integration-tests:
    name: Server - Integration Tests
    runs-on: ubuntu-latest
    needs: server-lint-build
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Server
    env:
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration --if-present || echo "No integration tests configured"

  client-carpool-build:
    name: CarPoolApp - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/CarPoolApp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Client/CarPoolApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Export web build
        run: npx expo export --platform web
        continue-on-error: true

  client-driver-build:
    name: DriverApp - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/DriverApp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Client/DriverApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Server
        working-directory: Server
        run: |
          npm ci
          npm audit --audit-level=high --json > audit-server.json || true
        continue-on-error: true

      - name: Audit CarPoolApp
        working-directory: Client/CarPoolApp
        run: |
          npm ci
          npm audit --audit-level=high --json > audit-carpool.json || true
        continue-on-error: true

      - name: Audit DriverApp
        working-directory: Client/DriverApp
        run: |
          npm ci
          npm audit --audit-level=high --json > audit-driver.json || true
        continue-on-error: true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audits
          path: |
            Server/audit-server.json
            Client/CarPoolApp/audit-carpool.json
            Client/DriverApp/audit-driver.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [server-lint-build, server-unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server image
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          push: false
          tags: ridepool-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
