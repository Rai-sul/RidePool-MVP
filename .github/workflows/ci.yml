name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # Client (React Native Expo) Build & Test
  client-build:
    name: Build & Test Client
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: RideShareDev/Client/CarPoolApp
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: RideShareDev/Client/CarPoolApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Build for Web
        run: npx expo export --platform web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-web-build
          path: RideShareDev/Client/CarPoolApp/dist/
          retention-days: 7

  # Server Build & Test
  server-build:
    name: Build & Test Server
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: RideShareDev/Server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: RideShareDev/Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test || echo "No tests configured yet"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: RideShareDev/Server/dist/
          retention-days: 7

  # Android Build (APK)
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: client-build
    
    defaults:
      run:
        working-directory: RideShareDev/Client/CarPoolApp
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: RideShareDev/Client/CarPoolApp/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Build Android APK
        run: |
          echo "To enable EAS Build:"
          echo "1. Run: eas build:configure"
          echo "2. Add EXPO_TOKEN to GitHub Secrets"
          echo "3. Uncomment the eas build command below"
          # eas build --platform android --profile preview --non-interactive

  # Code Quality & Security Checks
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: Security Audit - Client
        working-directory: RideShareDev/Client/CarPoolApp
        run: npm audit --audit-level=moderate || true

      - name: Security Audit - Server
        working-directory: RideShareDev/Server
        run: npm audit --audit-level=moderate || true

