  <text x="240" y="150" font-size="15" font-weight="700" fill="#111827">RidePool System</text>

  <!-- ===== associations: Rider ===== -->
  <g stroke="#374151" stroke-width="1.2" fill="none">
    <path d="M158,492 L240,192"/>
    <path d="M158,492 L238,253"/>
    <path d="M158,492 L236,316"/>
    <path d="M158,492 L235,379"/>
    <path d="M158,492 L235,619"/>
    <path d="M158,492 L237,682"/>
    <path d="M158,492 L240,744"/>
    <path d="M158,492 L457,436"/>
    <path d="M158,492 L455,500"/>
    <path d="M158,492 L457,564"/>
  </g>
  <!-- ===== associations: Driver ===== -->
  <g stroke="#374151" stroke-width="1.2" fill="none">
    <path d="M947,492 L862,191"/>
    <path d="M947,492 L864,253"/>
    <path d="M947,492 L866,316"/>
    <path d="M947,492 L866,619"/>
    <path d="M947,492 L864,682"/>
    <path d="M947,492 L644,436"/>
    <path d="M947,492 L645,500"/>
    <path d="M947,492 L644,564"/>
  </g>
