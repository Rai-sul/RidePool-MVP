<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 940" width="1120" height="940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="inc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#6b7280" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1120" height="940" fill="#ffffff"/>

