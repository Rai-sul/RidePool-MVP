  <g stroke="#374151" stroke-width="1.2" fill="none">
    <path d="M550,108 L550,224"/>
    <path d="M200,838 L284,710"/>
    <path d="M203,845 L285,772"/>
  </g>

  <!-- ===== include relationships ===== -->
  <g stroke="#6b7280" stroke-width="1.3" fill="none" stroke-dasharray="6 4" marker-end="url(#inc)">
    <path d="M420,193 L462,240"/>
    <path d="M425,250 L455,250"/>
    <path d="M675,250 L645,250"/>
    <path d="M420,628 L462,675"/>
    <path d="M425,685 L455,685"/>
  </g>

