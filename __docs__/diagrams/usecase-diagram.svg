    <ellipse cx="770" cy="185" rx="95" ry="26"/>
    <ellipse cx="770" cy="250" rx="95" ry="26"/>
    <ellipse cx="770" cy="315" rx="95" ry="26"/>
    <ellipse cx="770" cy="620" rx="95" ry="26"/>
    <ellipse cx="770" cy="685" rx="95" ry="26"/>
  </g>
  <g font-size="13" fill="#111827" text-anchor="middle">
    <text x="770" y="189">Go Online / Offline</text>
    <text x="770" y="254">Accept Pool Offer</text>
    <text x="770" y="319">Pick Up &amp; Drop Off</text>
    <text x="770" y="624">Complete Ride</text>
    <text x="770" y="689">View Earnings</text>
  </g>

  <!-- ===== shared use cases ===== -->
  <g fill="#f9fafb" stroke="#374151" stroke-width="1.4">
    <ellipse cx="550" cy="430" rx="95" ry="26"/>
    <ellipse cx="550" cy="500" rx="95" ry="26"/>
    <ellipse cx="550" cy="570" rx="95" ry="26"/>
  </g>
  <g font-size="13" fill="#111827" text-anchor="middle">
