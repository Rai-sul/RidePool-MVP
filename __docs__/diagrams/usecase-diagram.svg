    <ellipse cx="330" cy="250" rx="95" ry="26"/>
    <ellipse cx="330" cy="315" rx="95" ry="26"/>
    <ellipse cx="330" cy="380" rx="95" ry="26"/>
    <ellipse cx="330" cy="620" rx="95" ry="26"/>
    <ellipse cx="330" cy="685" rx="95" ry="26"/>
    <ellipse cx="330" cy="750" rx="95" ry="26"/>
  </g>
