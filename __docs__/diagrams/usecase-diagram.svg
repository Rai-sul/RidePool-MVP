    <text x="550" y="261">into a Pool</text>
    <text x="550" y="681">Calculate &amp;</text>
    <text x="550" y="696">Split Fare</text>
  </g>

  <!-- ===== actor: Rider ===== -->
  <g stroke="#111827" stroke-width="1.8" fill="none">
    <circle cx="130" cy="462" r="14" fill="#ffffff"/>
    <path d="M130,476 L130,520 M104,492 L156,492 M130,520 L112,550 M130,520 L148,550"/>
  </g>
  <text x="130" y="574" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Rider</text>

  <!-- ===== actor: Driver ===== -->
  <g stroke="#111827" stroke-width="1.8" fill="none">
    <circle cx="975" cy="462" r="14" fill="#ffffff"/>
    <path d="M975,476 L975,520 M949,492 L1001,492 M975,520 L957,550 M975,520 L993,550"/>
  </g>
  <text x="975" y="574" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Driver</text>

  <!-- ===== actor: Google Maps ===== -->
  <g stroke="#6b7280" stroke-width="1.6" fill="none">
    <circle cx="550" cy="30" r="11" fill="#ffffff"/>
    <path d="M550,41 L550,68 M531,50 L569,50 M550,68 L538,86 M550,68 L562,86"/>
  </g>
  <text x="550" y="102" font-size="12.5" fill="#374151" text-anchor="middle">&#171;system&#187; Google Maps Platform</text>

  <!-- ===== actor: Payment Gateway ===== -->
  <g stroke="#6b7280" stroke-width="1.6" fill="none">
    <circle cx="185" cy="828" r="11" fill="#ffffff"/>
    <path d="M185,839 L185,866 M166,848 L204,848 M185,866 L173,884 M185,866 L197,884"/>
  </g>
  <text x="185" y="906" font-size="12.5" fill="#374151" text-anchor="middle">&#171;system&#187; Payment Gateway</text>
  <text x="185" y="922" font-size="11.5" fill="#6b7280" text-anchor="middle">(bKash / SSLCommerz)</text>

  <!-- ===== legend ===== -->
  <rect x="420" y="848" width="400" height="66" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <path d="M438,872 L478,872" stroke="#374151" stroke-width="1.2"/>
  <text x="488" y="876" font-size="12" fill="#374151">association</text>
  <path d="M438,898 L470,898" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#inc)" fill="none"/>
  <text x="488" y="902" font-size="12" fill="#374151">&#171;include&#187;</text>
  <text x="592" y="876" font-size="12" fill="#6b7280">blue = rider  &#183;  amber = driver</text>
  <text x="592" y="902" font-size="12" fill="#6b7280">grey = shared / system-internal</text>
</svg>
