    <text x="330" y="189">Search &amp; Join Pool</text>
    <text x="330" y="254">Book Advance Ride</text>
    <text x="330" y="319">Set Female-Only Pool</text>
    <text x="330" y="384">Invite Priyo Sathi</text>
    <text x="330" y="624">Estimate Fare &amp; Route</text>
    <text x="330" y="689">Pay Fare</text>
    <text x="330" y="754">Top Up &amp; Use Wallet</text>
  </g>

  <!-- ===== driver use cases ===== -->
