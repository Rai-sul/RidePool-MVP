<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1280" width="1160" height="1280" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1160" height="1280" fill="#ffffff"/>

  <!-- ============ data flows: Rider ============ -->
  <g stroke="#374151" stroke-width="1.3" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <path d="M195,620 L440,180"/>
    <path d="M195,620 L440,400"/>
    <path d="M195,620 L440,620"/>
    <path d="M195,620 L440,840"/>
    <path d="M195,620 L440,1060"/>
  </g>
  <!-- ============ data flows: Driver ============ -->
  <g stroke="#374151" stroke-width="1.3" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <path d="M960,620 L760,400"/>
    <path d="M960,620 L760,620"/>
    <path d="M960,620 L760,840"/>
    <path d="M960,620 L760,1060"/>
  </g>
  <!-- ============ data flows: external systems ============ -->
  <g stroke="#374151" stroke-width="1.3" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <path d="M790,112 L762,168"/>
    <path d="M800,1198 L762,1078"/>
  </g>
  <!-- ============ process <-> store ============ -->
  <g stroke="#6b7280" stroke-width="1.3" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <path d="M600,212 L600,263"/>
    <path d="M600,432 L600,483"/>
    <path d="M600,652 L600,703"/>
    <path d="M600,872 L600,923"/>
    <path d="M600,1092 L600,1143"/>
  </g>

  <!-- ============ flow labels ============ -->
  <g font-size="12" fill="#4b5563" text-anchor="middle">
    <rect x="215" y="389" width="206" height="18" fill="#ffffff"/>
    <text x="318" y="402">trip request / fare &amp; pool offers</text>
    <rect x="224" y="499" width="188" height="18" fill="#ffffff"/>
    <text x="318" y="512">join &amp; location / driver &amp; ETA</text>
    <rect x="222" y="609" width="192" height="18" fill="#ffffff"/>
    <text x="318" y="622">credentials / session &amp; profile</text>
    <rect x="215" y="719" width="206" height="18" fill="#ffffff"/>
    <text x="318" y="732">rating &amp; comment / penalty notice</text>
    <rect x="233" y="829" width="170" height="18" fill="#ffffff"/>
    <text x="318" y="842">payment method / fare split</text>

    <rect x="781" y="499" width="158" height="18" fill="#ffffff"/>
    <text x="860" y="512">GPS &amp; accept / pool offer</text>
    <rect x="769" y="609" width="182" height="18" fill="#ffffff"/>
    <text x="860" y="622">credentials / vehicle details</text>
    <rect x="812" y="719" width="96" height="18" fill="#ffffff"/>
    <text x="860" y="732">rating of rider</text>
    <rect x="803" y="829" width="114" height="18" fill="#ffffff"/>
    <text x="860" y="842">earnings statement</text>
  </g>
  <g font-size="11.5" fill="#4b5563">
    <text x="800" y="150">route &#183; distance &#183; ETA</text>
    <text x="806" y="1150">charge / confirmation</text>
  </g>

  <!-- ============ processes ============ -->
  <g fill="#eff6ff" stroke="#2563eb" stroke-width="1.5">
    <rect x="440" y="148"  width="320" height="64" rx="10"/>
    <rect x="440" y="368"  width="320" height="64" rx="10"/>
    <rect x="440" y="588"  width="320" height="64" rx="10"/>
    <rect x="440" y="808"  width="320" height="64" rx="10"/>
    <rect x="440" y="1028" width="320" height="64" rx="10"/>
  </g>
  <g text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#2563eb">
      <text x="600" y="174">1.0</text>
      <text x="600" y="394">2.0</text>
      <text x="600" y="614">3.0</text>
      <text x="600" y="834">4.0</text>
      <text x="600" y="1054">5.0</text>
    </g>
    <g font-size="14" fill="#111827">
      <text x="600" y="196">Ride Planning &amp; Pool Matching</text>
      <text x="600" y="416">Dispatch &amp; Trip Execution</text>
      <text x="600" y="636">Account &amp; Profile Management</text>
      <text x="600" y="856">Rating &amp; Penalty</text>
      <text x="600" y="1076">Fare Settlement &amp; Wallet</text>
    </g>
  </g>

  <!-- ============ data stores (open-ended, Gane-Sarson) ============ -->
  <g>
    <g fill="#f9fafb">
      <rect x="450" y="263"  width="300" height="54"/>
      <rect x="450" y="483"  width="300" height="54"/>
      <rect x="450" y="703"  width="300" height="54"/>
      <rect x="450" y="923"  width="300" height="54"/>
      <rect x="450" y="1143" width="300" height="54"/>
    </g>
    <g stroke="#6b7280" stroke-width="1.4" fill="none">
      <path d="M750,263 L450,263 L450,317 L750,317 M496,263 L496,317"/>
      <path d="M750,483 L450,483 L450,537 L750,537 M496,483 L496,537"/>
      <path d="M750,703 L450,703 L450,757 L750,757 M496,703 L496,757"/>
      <path d="M750,923 L450,923 L450,977 L750,977 M496,923 L496,977"/>
      <path d="M750,1143 L450,1143 L450,1197 L750,1197 M496,1143 L496,1197"/>
    </g>
    <g font-size="13" font-weight="700" fill="#374151" text-anchor="middle">
      <text x="473" y="295">D1</text>
      <text x="473" y="515">D2</text>
      <text x="473" y="735">D3</text>
      <text x="473" y="955">D4</text>
      <text x="473" y="1175">D5</text>
    </g>
    <g font-size="11.5" fill="#111827">
      <text x="512" y="285">pools &#183; pool_members</text>
      <text x="512" y="303" fill="#6b7280">H3 pickup &amp; destination index</text>
      <text x="512" y="505">rides &#183; driver_sessions</text>
      <text x="512" y="523" fill="#6b7280">messages &#183; notifications</text>
      <text x="512" y="725">users &#183; vehicles &#183; saved_places</text>
      <text x="512" y="743" fill="#6b7280">priyo_sathi &#183; device_tokens</text>
      <text x="512" y="945">ratings &#183; user_cancellations</text>
      <text x="512" y="963" fill="#6b7280">cooldown_periods</text>
      <text x="512" y="1165">wallets &#183; wallet_transactions</text>
      <text x="512" y="1183" fill="#6b7280">payments &#183; driver_earnings</text>
    </g>
  </g>

  <!-- ============ external entities ============ -->
  <g fill="#ffffff" stroke="#111827" stroke-width="1.6">
    <rect x="45"  y="588"  width="150" height="64"/>
    <rect x="960" y="588"  width="150" height="64"/>
    <rect x="765" y="48"   width="250" height="64"/>
    <rect x="765" y="1198" width="250" height="64"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="120"  y="626" font-size="15" font-weight="700">Rider</text>
    <text x="1035" y="626" font-size="15" font-weight="700">Driver</text>
    <text x="890" y="76"  font-size="14" font-weight="700">Google Maps Platform</text>
    <text x="890" y="95"  font-size="11.5" fill="#6b7280">Directions &#183; Distance Matrix</text>
    <text x="890" y="1226" font-size="14" font-weight="700">Payment Gateway</text>
    <text x="890" y="1245" font-size="11.5" fill="#6b7280">bKash &#183; SSLCommerz</text>
  </g>

  <!-- ============ legend ============ -->
  <rect x="50" y="1035" width="352" height="155" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="70" y="1055" width="58" height="26" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144" y="1073" font-size="12.5" fill="#374151">process (numbered)</text>
  <rect x="70" y="1093" width="58" height="26" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="144" y="1111" font-size="12.5" fill="#374151">external entity</text>
  <g>
    <rect x="70" y="1131" width="58" height="26" fill="#f9fafb"/>
    <path d="M128,1131 L70,1131 L70,1157 L128,1157 M84,1131 L84,1157" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  </g>
  <text x="144" y="1149" font-size="12.5" fill="#374151">data store</text>
  <path d="M74,1175 L124,1175" stroke="#374151" stroke-width="1.3" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="144" y="1179" font-size="12.5" fill="#374151">data flow (both directions)</text>
</svg>
